spring:
  application:
    name: gestao-servicos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_servicos}
    username: ${DB_USER:gestao_servicos}
    password: ${DB_PASSWORD:gestao_servicos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-message: never
app:
  cors:
    origensPermitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    segredo: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    minutosExpiracao: ${JWT_EXPIRATION_MINUTES:60}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
