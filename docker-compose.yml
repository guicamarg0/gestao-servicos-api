services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestao_servicos
      POSTGRES_USER: gestao_servicos
      POSTGRES_PASSWORD: gestao_servicos
    ports:
      - "5432:5432"
    volumes:
      - gestao-servicos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_servicos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestao-servicos-postgres:
